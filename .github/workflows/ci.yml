name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: agenthub
          POSTGRES_PASSWORD: agenthub
          POSTGRES_DB: agenthub_test
        ports: ["5440:5432"]
        options: >-
          --health-cmd "pg_isready -U agenthub"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      DATABASE_URL: postgres://agenthub:agenthub@127.0.0.1:5440/agenthub_test
      BETTER_AUTH_SECRET: ci-secret-ci-secret-ci-secret-ci-secret-0123
      ENCRYPTION_KEYS: "1:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY="
      APP_URL: http://localhost:3200
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results
